nc: 12
names:
  0: ignored-region
  1: pedestrian
  2: people
  3: bicycle
  4: car
  5: van
  6: truck
  7: tricycle
  8: awning-tricycle
  9: bus
  10: motor
  11: others
variant: fast
eval_spatial_size: [640, 640]

liteuav_backbone:
  name: B2
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: false
  use_lab: true
  pretrained: false

liteuav_encoder:
  in_channels: [96, 384, 768, 1536]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024

liteuav_decoder:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  dim_feedforward: 1024
  num_levels: 4
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_points: [4, 4, 4, 4]
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1

liteuav_postprocessor:
  num_top_queries: 350
  use_focal_loss: true
  remap_mscoco_category: false

liteuav_train:
  epochs: 200
  stop_epoch: 176
  optimizer: AdamW
  lr: 0.0004
  backbone_lr: 0.00003
  weight_decay: 0.000065
  warmup_steps: 500
  clip_grad_norm: 0.1
  ema_decay: 0.9999
  ema_warmups: 1000
