nc: 12
names:
  0: ignored-region
  1: pedestrian
  2: people
  3: bicycle
  4: car
  5: van
  6: truck
  7: tricycle
  8: awning-tricycle
  9: bus
  10: motor
  11: others
variant: ultrafast
eval_spatial_size: [640, 640]

liteuav_backbone:
  name: B0
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: false
  use_lab: true
  pretrained: false

liteuav_encoder:
  in_channels: [64, 256, 512, 1024]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 128
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 512

liteuav_decoder:
  feat_channels: [128, 128, 128, 128]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 4
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_points: [6, 6, 6, 6]
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1

liteuav_postprocessor:
  num_top_queries: 350
  use_focal_loss: true
  remap_mscoco_category: false

liteuav_train:
  epochs: 220
  stop_epoch: 196
  optimizer: AdamW
  lr: 0.0008
  backbone_lr: 0.0004
  weight_decay: 0.0001
  warmup_steps: 500
  clip_grad_norm: 0.1
  ema_decay: 0.9999
  ema_warmups: 1000
