# LiteUAVDETR VisDrone dataset configuration adapted from D-FINE:
# https://github.com/Peterande/D-FINE

task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# VisDrone IDs 1..10 are used directly. Keep slots 0..11 for checkpoint
# compatibility; the converter filters ignored category 0 and other category 11.
num_classes: 12
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/VisDrone2019/Image/DET-train/images
    ann_file: ./data/VisDrone2019/Image/annotation_external_tool/VisDrone2019-DET_train_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Mosaic, size: [800, 800], p: 1.0}
        - {type: MixUp, alpha: 1.5, p: 0.2}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: Resize, size: [800, 800], } 
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 12
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/VisDrone2019/Image/DET-val/images
    ann_file: ./data/VisDrone2019/Image/annotation_external_tool/VisDrone2019-DET_val_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 12
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
