# LiteUAVDETR Fast UAVDT recipe, adapted from the validated release setting
# and D-FINE: https://github.com/Peterande/D-FINE

__include__: [
  '../../dataset/uavdt_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/liteuavdetr_hgnetv2.yml',
]

output_dir: ./output/liteuavdetr_uavdt/liteuavdetr_fast_uavdt_640

LiteUAVDETR:
  backbone: HGNetv2
  encoder: LiteUAVDETREncoder

HGNetv2:
  name: B2
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

LiteUAVDETREncoder:
  in_channels: [96, 384, 768, 1536]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024

LiteUAVDETRTransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  dim_feedforward: 1024
  num_levels: 4
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_points: [4, 4, 4, 4]

LiteUAVDETRPostProcessor:
  num_top_queries: 350

eval_spatial_size: [640, 640]
use_amp: False
use_ema: True

epochs: 200

train_dataloader:
  total_batch_size: 8
  num_workers: 8
  dataset:
    img_folder: ./data/UAVDT/UAV-benchmark-M
    ann_file: ./data/UAVDT/coco_annotations/UAVDT-DET_train_coco.json
    transforms:
      ops:
        - {type: Mosaic2, size: [640, 640], p: 1.0}
        - {type: MixUp, alpha: 1.5, p: 0.2}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: 176
        ops: [Mosaic2, MixUp, RandomPhotometricDistort, RandomZoomOut, RandomIoUCrop]
  collate_fn:
    base_size: 640
    stop_epoch: 176
    ema_restart_decay: 0.9999
    base_size_repeat: 2

val_dataloader:
  total_batch_size: 16
  num_workers: 8
  dataset:
    img_folder: ./data/UAVDT/UAV-benchmark-M
    ann_file: ./data/UAVDT/coco_annotations/UAVDT-DET_test_coco.json
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: float32, scale: True}

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00003
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00003
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [500]
  gamma: 0.1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
