# LiteUAVDETR UltraFast, adapted from D-FINE: https://github.com/Peterande/D-FINE
# LiteUAVDETR modifications Copyright (c) 2026 The LiteUAVDETR Authors.

__include__: [
  '../../dataset/custom_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/liteuavdetr_hgnetv2.yml',
]

output_dir: ./output/liteuavdetr_visdrone/liteuavdetr_ultrafast_visdrone_640

LiteUAVDETR:
  backbone: HGNetv2
  encoder: LiteUAVDETREncoder

HGNetv2:
  name: B0
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

LiteUAVDETREncoder:
  in_channels: [64, 256, 512, 1024]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 128
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 512

LiteUAVDETRTransformer:
  feat_channels: [128, 128, 128, 128]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 4
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_points: [6, 6, 6, 6]

LiteUAVDETRPostProcessor:
  num_top_queries: 350

eval_spatial_size: [640, 640]
use_amp: False
use_ema: True

epochs: 220

train_dataloader:
  total_batch_size: 8
  num_workers: 12
  dataset:
    img_folder: ./data/VisDrone2019/Image/DET-train/images
    ann_file: ./data/VisDrone2019/Image/annotation_external_tool/VisDrone2019-DET_train_coco.json
    transforms:
      ops:
        - {type: Mosaic2, size: [640, 640], p: 1.0}
        - {type: MixUp, alpha: 1.5, p: 0.2}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: 196
        ops: [Mosaic2, MixUp, RandomPhotometricDistort, RandomZoomOut, RandomIoUCrop]
  collate_fn:
    base_size: 640
    stop_epoch: 196
    ema_restart_decay: 0.9999
    base_size_repeat: 2

val_dataloader:
  total_batch_size: 16
  num_workers: 12
  dataset:
    img_folder: ./data/VisDrone2019/Image/DET-val/images
    ann_file: ./data/VisDrone2019/Image/annotation_external_tool/VisDrone2019-DET_val_coco.json
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: float32, scale: True}

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [500]
  gamma: 0.1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
